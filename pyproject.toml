[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-parser"
dynamic = ["version"]
description = "한국어 문서 파서: 통합 문서 모델, 후처리 없는 HTML, LLM용 텍스트, 한국어 처리"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "우정호 (woojungho)" }]
requires-python = ">=3.10"
dependencies = [
    "kiwipiepy>=0.20",
    "lxml>=5",
    "olefile>=0.46",  # HWP 5.0 (OLE 복합 파일)
    "pydantic>=2.6",
]

[project.optional-dependencies]
docling = ["docling>=2.50"]
pdf = ["docling>=2.50", "pypdfium2>=4", "pillow>=10", "onnxruntime>=1.17"]  # onnxruntime: 스캔 PDF OCR(RapidOCR)
dev = [
    "pytest>=8",
    "python-docx>=1.1",  # tests/fixtures 생성
    "pillow>=10",
]
visual = ["playwright>=1.40", "pypdfium2>=4", "pillow>=10"]
eval = ["rapidfuzz>=3", "apted>=1.0", "python-docx>=1.1"]  # benchmarks/eval (정답 세트 평가)

[project.scripts]
korean-parser = "korean_parser.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "korean_parser.__version__"}

[tool.setuptools.packages.find]
include = ["korean_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
